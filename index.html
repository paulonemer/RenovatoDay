<!DOCTYPE html>
<html>
<head>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rouge+Script&display=swap');
        
        body {
            margin: 0;
            overflow: hidden;
            background-color: black;
            cursor: pointer;
        }
        
        #canvas {
            position: fixed;
            top: 0;
            left: 0;
        }
        
        #overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: all 4s ease-out;
            pointer-events: none;
        }
        
        .content-container {
    position: fixed;           /* Garante que o conteúdo (texto e imagem) seja fixo na tela */
    top: 50%;                   /* Centraliza verticalmente */
    left: 50%;                  /* Centraliza horizontalmente */
    transform: translate(-50%, -50%); /* Ajusta para centralizar perfeitamente */
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    z-index: 10;               /* Garante que o texto esteja acima da imagem */
    pointer-events: auto;      /* Permite interação com o texto */
}

.text-container {
    color: black;
    font-size: 2em;
    font-family: 'Rouge Script', cursive;
    opacity: 0;
    transition: opacity 1.5s;
    text-align: center;
    z-index: 15;               /* Garante que o texto fique sobre a imagem */
}

.image-container {
    position: absolute;        /* Coloca o container da imagem de forma absoluta */
    top: 0;
    left: 0;
    width: 100vw;              /* A largura do container ocupa 100% da tela */
    height: 100vh;             /* A altura do container ocupa 100% da tela */
    display: flex;
    justify-content: center;   /* Centraliza a imagem horizontalmente */
    align-items: center;       /* Centraliza a imagem verticalmente */
    opacity: 0;
    transition: opacity 1.5s;
    pointer-events: none;      /* Não permite interação com a imagem */
}

.image-container img {
    max-width: 100%;            /* A imagem pode ocupar até 100% da largura do container */
    max-height: 100%;           /* A imagem pode ocupar até 100% da altura do container */
    object-fit: contain;       /* Garante que a imagem não será cortada e mantém a proporção */
}

        
        .active {
            pointer-events: auto;
            opacity: 1;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="overlay"></div>
    <div class="content-container">
        <div class="text-container"></div>
        <div class="image-container"></div>
    </div>
    <audio id="music" src="musica.mp3"></audio>

    <script>
        // CONFIGURAÇÕES PERSONALIZÁVEIS
        const config = {
            totalGrowthSteps: 5,       // Cliques necessários para ativar a expansão total
            useImage: true,            // true/false para mostrar imagem
            imageUrl: 'imagem.jpg',    // URL da imagem
            texts: [                  
                {text: "No dia 4 de maio de 2005, uma linda estrela brilhou no céu. Nasceu uma pessoa especial, que ilumina a vida de muitos. ", image: 'foto01.png'},
                {text: "Artur, meu amor, sua vida é um lindo fenômeno que traz luz e clareza aos sentimentos. Sua graça, seu sorriso radiante e suas manias que te compõem, tornam você especial como uma estrela. No meu céu, destinei a imensidão do infinito apenas para o seu brilho.  Dentro de mim, te guardo como meu tesouro. Quero que viva, viva feliz e satisfeito, brilhando como o sol que beija nossos oceanos.", image: 'foto02.png'},
                {text: "Minha estrela brilhante", image: 'foto03.png'}
            ],
            twinkleStars: 300,         // Quantidade de estrelas cintilantes
            textFadeDuration: 1500     // Duração da transição do conteúdo
        };

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const textContainer = document.querySelector('.text-container');
        const imageContainer = document.querySelector('.image-container');
        const music = document.getElementById('music');
        
        let stars = [];
        let growingStars = [];
        let currentGrowthStep = 0;
        let currentContentIndex = -1;
        let isFinalAnimation = false;

        // Classe para as estrelas cintilantes de fundo
        class TwinkleStar {
            constructor() {
                this.reset(true);
                this.phase = Math.random() * Math.PI * 2;
            }
            
            reset(initial = false) {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.baseSize = Math.random() * 1.2 + 0.3;
                this.speed = Math.random() * 0.02 + 0.01;
                if(initial) this.life = Math.random() * 100;
            }
            
            update() {
                this.life += this.speed;
                this.opacity = Math.abs(Math.sin(this.life + this.phase));
                this.size = this.baseSize * this.opacity;
                
                if(this.opacity <= 0.01) {
                    this.reset();
                }
            }
            
            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Classe para as estrelas interativas
        class GrowingStar {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = 10;
                this.opacity = 0.5;
                this.growthStep = 0;
            }
            
            grow() {
                if (this.growthStep >= config.totalGrowthSteps) {
                    this.expandToWhite();
                    return;
                }
                
                this.size *= 1.5;
                this.opacity = Math.min(1, this.opacity + 0.1);
                this.growthStep++;
            }
            
            expandToWhite() {
                isFinalAnimation = true;
                overlay.style.width = '300vw';
                overlay.style.height = '300vw';
                overlay.style.opacity = '1';
                
                setTimeout(() => {
                    music.play();
                    showNextContent();
                }, 2000);
            }
            
            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initStars() {
            for(let i = 0; i < config.twinkleStars; i++) {
                stars.push(new TwinkleStar());
            }
        }

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if(!isFinalAnimation) {
                stars.forEach(star => {
                    star.update();
                    star.draw();
                });
            }
            
            growingStars.forEach(star => {
                star.draw();
            });
            
            requestAnimationFrame(animate);
        }

        function showNextContent() {
            currentContentIndex = (currentContentIndex + 1) % config.texts.length;
            const content = config.texts[currentContentIndex];
            
            textContainer.textContent = content.text;
            textContainer.style.opacity = '0';
            
            if(config.useImage && content.image) {
                imageContainer.innerHTML = `<img src="${content.image}" alt="">`;
                imageContainer.style.opacity = '0';
            } else {
                imageContainer.innerHTML = '';
            }
            
            setTimeout(() => {
                textContainer.style.opacity = '1';
                if(config.useImage && content.image) {
                    imageContainer.style.opacity = '1';
                }
                textContainer.classList.add('active');
                imageContainer.classList.add('active');
            }, 50);
        }

        window.addEventListener('resize', resize);
        
        window.addEventListener('click', (e) => {
            if (isFinalAnimation) return;
            
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            if(growingStars.length === 0 || currentGrowthStep >= config.totalGrowthSteps) {
                growingStars.push(new GrowingStar(x, y));
                currentGrowthStep = 0;
            }
            
            growingStars.forEach(star => star.grow());
            currentGrowthStep++;
        });

        document.querySelector('.content-container').addEventListener('click', () => {
            textContainer.style.opacity = '0';
            imageContainer.style.opacity = '0';
            textContainer.classList.remove('active');
            imageContainer.classList.remove('active');
            
            setTimeout(() => {
                showNextContent();
            }, config.textFadeDuration);
        });

        // Inicialização
        resize();
        initStars();
        animate();
        document.fonts.load('1em "Poppins"');
    </script>
</body>
</html>
